<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- 项目图标。配色全部取自游戏自身，没有另发明颜色：
         #47455E = UI 面板底色(ui/themes/base_theme.tres)
         #FFE64D = 默认光标/选中框的颜色(src/settings_panel.gd 的 PALETTE 第一格)
         #F2F5F7 = 按钮图标用的那个白
       造型也用它自己的视觉签名：**黄框(游戏里那个选中框)套着一颗雷**。 -->
  <rect width="256" height="256" rx="56" fill="#47455E"/>
  <rect x="40" y="40" width="176" height="176" rx="28" fill="none" stroke="#FFE64D" stroke-width="12"/>
  <g stroke="#F2F5F7" stroke-width="15" stroke-linecap="round">
    <line x1="160"   y1="128"   x2="194"   y2="128"/>
    <line x1="150.6" y1="150.6" x2="174.7" y2="174.7"/>
    <line x1="128"   y1="160"   x2="128"   y2="194"/>
    <line x1="105.4" y1="150.6" x2="81.3"  y2="174.7"/>
    <line x1="96"    y1="128"   x2="62"    y2="128"/>
    <line x1="105.4" y1="105.4" x2="81.3"  y2="81.3"/>
    <line x1="128"   y1="96"    x2="128"   y2="62"/>
    <line x1="150.6" y1="105.4" x2="174.7" y2="81.3"/>
  </g>
  <circle cx="128" cy="128" r="42" fill="#F2F5F7"/>
</svg>
