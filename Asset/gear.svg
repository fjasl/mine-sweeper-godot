      <rect x="14" y="0"  width="4" height="8" transform="rotate(135 16 16)"/>
      <rect x="14" y="0"  width="4" height="8" transform="rotate(180 16 16)"/>
      <rect x="14" y="0"  width="4" height="8" transform="rotate(225 16 16)"/>
      <rect x="14" y="0"  width="4" height="8" transform="rotate(270 16 16)"/>
